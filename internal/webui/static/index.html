<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOCV Package Explorer</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <div class="brand">
      <p class="eyebrow">NOCV</p>
      <h1>Package dependencies</h1>
    </div>
    <div id="analysis-status" class="analysis-status" role="status" hidden></div>
    <div class="package-search">
      <label class="visually-hidden" for="package-search-input">Search packages</label>
      <input id="package-search-input" class="package-search-input" type="search" placeholder="Search packages..." autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="package-search-results" aria-expanded="false">
      <div id="package-search-results" class="package-search-results" role="listbox" hidden></div>
    </div>
    <p class="legend"><span></span> dependency → dependent</p>
  </header>
  <main>
    <div id="graph-pane">
      <div id="type-context" class="type-context" hidden>
        <button id="back-to-packages" class="back-button" type="button">← Packages</button>
        <div>
          <span>Types explaining</span>
          <strong id="type-context-title"></strong>
        </div>
      </div>
      <section id="network" class="network-canvas" aria-label="Package dependency graph"></section>
      <section id="type-network" class="network-canvas" aria-label="Type dependency graph" hidden></section>
    </div>
    <aside id="inspector" aria-live="polite">
      <div class="empty-state">
        <p class="eyebrow">Inspector</p>
        <h2>Select a package or dependency</h2>
        <p>Arrows point from a dependency to the package that uses it.</p>
      </div>
    </aside>
  </main>
  <script src="/static/vis-network.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
